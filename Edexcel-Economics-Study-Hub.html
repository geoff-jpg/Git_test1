<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edexcel Economics Study Hub</title>
<link data-hub rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap">
<style data-hub>
  :root{
    --bg:#EEF2F8; --surface:#FFFFFF; --surface-2:#F6F8FC; --line:#DCE2EE;
    --ink:#172033; --ink-soft:#4A5670; --faint:#76819A;
    --paper:var(--surface-2); --raised:var(--surface); --grid:var(--line);
    --p1:#1C7A5E; --p1-bg:#DDF1E9;
    --p2:#2A5D9F; --p2-bg:#E2EBF8;
    --p3:#7A3B8F; --p3-bg:#F1E5F5;
    --au:#B07A0A; --au-bg:#FAF0D4;
    --teal:#1E8A57; --teal-bg:#E2F3EA;
    --red:#C23E2B; --red-bg:#FBE8E4;
    --gold:#AD7F0A; --gold-bg:#FBF1D6;
    --acc:var(--p1); --acc-bg:var(--p1-bg);
    --shadow:0 1px 2px rgba(23,32,51,.06), 0 4px 14px rgba(23,32,51,.06);
    --font-display:'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --font-sans:'Source Sans 3', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --font-serif:var(--font-display);
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#0E1321; --surface:#171E30; --surface-2:#1C2438; --line:#2A3450;
      --ink:#E8ECF5; --ink-soft:#B2BCD2; --faint:#8490A9;
      --p1:#5CC7A6; --p1-bg:#123027;
      --p2:#82AAEC; --p2-bg:#172743;
      --p3:#CE97E0; --p3-bg:#2C1B33;
      --au:#E4B650; --au-bg:#352B14;
      --teal:#5BCB91; --teal-bg:#163224;
      --red:#F07E68; --red-bg:#3A1F1A;
      --gold:#E4B650; --gold-bg:#352B14;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1321; --surface:#171E30; --surface-2:#1C2438; --line:#2A3450;
    --ink:#E8ECF5; --ink-soft:#B2BCD2; --faint:#8490A9;
    --p1:#5CC7A6; --p1-bg:#123027;
    --p2:#82AAEC; --p2-bg:#172743;
    --p3:#CE97E0; --p3-bg:#2C1B33;
    --au:#E4B650; --au-bg:#352B14;
    --teal:#5BCB91; --teal-bg:#163224;
    --red:#F07E68; --red-bg:#3A1F1A;
    --gold:#E4B650; --gold-bg:#352B14;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
  [data-acc="p1"]{ --acc:var(--p1); --acc-bg:var(--p1-bg); }
  [data-acc="p2"]{ --acc:var(--p2); --acc-bg:var(--p2-bg); }
  [data-acc="p3"]{ --acc:var(--p3); --acc-bg:var(--p3-bg); }
  [data-acc="au"]{ --acc:var(--au); --acc-bg:var(--au-bg); }

  *{ box-sizing:border-box; }
  html,body{ min-height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-sans); font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  ::selection{ background:var(--acc-bg); }
  button:focus-visible, select:focus-visible, a:focus-visible, textarea:focus-visible{ outline:2px solid var(--acc); outline-offset:2px; }
  h1,h2,h3,h4{ text-wrap:balance; }

  /* ---------- App shell ---------- */
  .layout{ display:grid; grid-template-columns:272px minmax(0,1fr); min-height:100vh; }
  .side{
    position:sticky; top:env(safe-area-inset-top,0px); align-self:start; height:100vh; overflow-y:auto;
    background:var(--surface); border-right:1px solid var(--line);
    padding:22px 16px; display:flex; flex-direction:column; gap:22px;
  }
  .brand{ display:flex; align-items:center; gap:10px; background:none; border:none; padding:0; color:var(--ink); text-align:left; }
  .brand-mark{
    width:40px; height:40px; flex:none; border-radius:11px; display:grid; place-items:center;
    background:conic-gradient(from 200deg, var(--p1), var(--p2), var(--p3), var(--au), var(--p1));
    color:#fff; font-family:var(--font-display); font-weight:700; font-size:1.25rem;
  }
  .brand-mark i{ font-style:normal; background:var(--surface); color:var(--ink); width:30px; height:30px; border-radius:8px; display:grid; place-items:center; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-family:var(--font-display); font-size:1.02rem; font-weight:700; }
  .brand-text small{ font-family:var(--font-mono); font-size:.7rem; color:var(--faint); letter-spacing:.04em; }

  .paper-menu{ display:flex; flex-direction:column; gap:4px; }
  .pm-label{ font-size:.7rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); margin:8px 8px 4px; }
  .pm-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left;
    background:none; border:none; border-radius:10px; padding:9px 10px; color:var(--ink-soft);
    font-size:.93rem; font-weight:600;
  }
  .pm-btn:hover:not(:disabled){ background:var(--surface-2); color:var(--ink); }
  .pm-btn.on{ background:var(--acc-bg); color:var(--ink); }
  .pm-btn:disabled{ opacity:.4; cursor:default; }
  .pm-dot{ width:10px; height:10px; border-radius:50%; background:var(--acc); flex:none; }
  .pm-home .pm-dot{ background:conic-gradient(var(--p1) 0 25%, var(--p2) 0 50%, var(--p3) 0 75%, var(--au) 0); }
  .pm-name{ flex:1; min-width:0; }
  .pm-count{ font-family:var(--font-mono); font-size:.72rem; color:var(--faint); font-variant-numeric:tabular-nums; }
  .pm-exam{
    margin-top:10px; padding:10px 12px; border-radius:10px; border:1px dashed var(--acc); background:none; color:var(--acc);
    font-size:.85rem; font-weight:700; text-align:left;
  }
  .pm-exam span{ font-weight:500; }
  .side-foot{ margin-top:auto; font-size:.76rem; color:var(--faint); line-height:1.5; }

  .main{ min-width:0; padding:28px 32px 64px; }
  .shell{ max-width:1040px; margin:0 auto; }

  @media (max-width:880px){
    .layout{ grid-template-columns:1fr; }
    .side{
      position:sticky; top:env(safe-area-inset-top,0px); z-index:10; height:auto; flex-direction:row; align-items:center;
      gap:12px; padding:10px 16px; border-right:none; border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden;
    }
    .brand-text, .side-foot, .pm-label{ display:none; }
    .brand-mark{ width:34px; height:34px; font-size:1.05rem; }
    .brand-mark i{ width:25px; height:25px; }
    .paper-menu{ flex-direction:row; gap:6px; }
    .pm-btn{ width:auto; white-space:nowrap; padding:7px 11px; border:1px solid var(--line); border-radius:999px; font-size:.84rem; }
    .pm-count{ display:none; }
    .pm-exam{ margin:0; white-space:nowrap; padding:7px 11px; border-radius:999px; }
    .main{ padding:20px 16px 56px; }
  }

  /* ---------- Dashboard ---------- */
  .dash-head{ display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap; margin-bottom:24px; }
  .dash-head .eyebrow{ font-size:.75rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); margin:0 0 6px; }
  .dash-head h1{ font-family:var(--font-display); font-size:clamp(1.7rem, 3.4vw, 2.3rem); line-height:1.1; font-weight:700; margin:0 0 8px; letter-spacing:-.01em; }
  .dash-head p{ margin:0; color:var(--ink-soft); line-height:1.55; max-width:58ch; }
  .ring-wrap{ display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 18px 12px 12px; box-shadow:var(--shadow); }
  .ring{ width:78px; height:78px; flex:none; }
  .ring .track{ fill:none; stroke:var(--line); stroke-width:9; }
  .ring .seg{ fill:none; stroke-width:9; stroke-linecap:butt; }
  .ring text{ font-family:var(--font-display); font-weight:700; font-size:19px; fill:var(--ink); text-anchor:middle; dominant-baseline:central; }
  .ring-wrap b{ display:block; font-family:var(--font-display); font-size:1.05rem; }
  .ring-wrap span{ font-size:.84rem; color:var(--ink-soft); }

  .tiles{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:22px; }
  @media (max-width:760px){ .tiles{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .tile{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; }
  .tile .lbl{ font-size:.74rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); }
  .tile .val{ font-family:var(--font-display); font-size:1.9rem; font-weight:700; line-height:1.1; font-variant-numeric:tabular-nums; color:var(--acc); }
  .tile .sub{ font-size:.82rem; color:var(--ink-soft); }

  .continue{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--acc); color:#fff; border-radius:16px; padding:16px 20px; margin-bottom:26px;
  }
  :root[data-theme="dark"] .continue{ color:#0E1321; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .continue{ color:#0E1321; } }
  .continue small{ font-size:.76rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85; }
  .continue h3{ font-family:var(--font-display); font-size:1.2rem; margin:2px 0 0; font-weight:700; }
  .continue button{ background:var(--surface); color:var(--ink); border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:.9rem; }
  .continue button:hover{ filter:brightness(.96); }

  .sec-title{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 12px; }
  .sec-title h2{ font-family:var(--font-display); font-size:1.25rem; font-weight:700; margin:0; }
  .sec-title span{ font-size:.84rem; color:var(--faint); }

  .paper-cards{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:30px; }
  @media (max-width:980px){ .paper-cards{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  @media (max-width:520px){ .paper-cards{ grid-template-columns:1fr; } }
  .pcard{
    background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden;
    display:flex; flex-direction:column; text-align:left; padding:0; color:var(--ink); box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }
  .pcard:hover:not(:disabled){ transform:translateY(-2px); border-color:var(--acc); }
  .pcard:disabled{ opacity:.55; cursor:default; }
  .pcard .band{ background:var(--acc); color:#fff; padding:14px 16px 12px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  :root[data-theme="dark"] .pcard .band{ color:#0E1321; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pcard .band{ color:#0E1321; } }
  .pcard .band b{ font-family:var(--font-display); font-size:1.3rem; font-weight:700; line-height:1.1; }
  .pcard .band code{ font-family:var(--font-mono); font-size:.7rem; opacity:.85; padding-top:4px; }
  .pcard .body{ padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .pcard .strand{ font-weight:700; font-size:.98rem; }
  .pcard .facts{ font-size:.82rem; color:var(--ink-soft); }
  .pcard .facts b{ color:var(--ink); font-variant-numeric:tabular-nums; }
  .bar{ height:8px; border-radius:99px; background:var(--acc-bg); overflow:hidden; }
  .bar i{ display:block; height:100%; background:var(--acc); border-radius:99px; min-width:0; }
  .pcard .prog{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--faint); margin-top:auto; font-variant-numeric:tabular-nums; }
  .pcard .open{ font-size:.86rem; font-weight:700; color:var(--acc); }

  .map{ display:flex; flex-direction:column; gap:18px; margin-bottom:28px; }
  .map-row{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px 16px; }
  .map-row h3{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:1rem; font-weight:700; margin:0 0 12px; }
  .map-row h3 .pm-dot{ width:12px; height:12px; }
  .map-row h3 span.cnt{ margin-left:auto; font-family:var(--font-mono); font-size:.74rem; color:var(--faint); font-weight:500; }
  .chips{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .chip{
    position:relative; display:flex; flex-direction:column; gap:3px; text-align:left;
    background:var(--acc-bg); border:1px solid transparent; border-radius:11px; padding:9px 11px 10px; color:var(--ink);
    min-height:64px;
  }
  .chip:hover:not(:disabled){ border-color:var(--acc); }
  .chip:disabled{ background:var(--surface-2); color:var(--faint); cursor:default; }
  .chip .c{ font-family:var(--font-mono); font-size:.72rem; font-weight:600; color:var(--acc); }
  .chip .n{ font-size:.86rem; font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .chip.done{ background:var(--acc); color:#fff; }
  .chip.done .c{ color:inherit; opacity:.85; }
  :root[data-theme="dark"] .chip.done{ color:#0E1321; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.done{ color:#0E1321; } }
  .chip.done::after{ content:'✓'; position:absolute; top:7px; right:10px; font-weight:800; font-size:.85rem; }

  .legend{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; margin-bottom:10px; }
  @media (max-width:760px){ .legend{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
  .legend .box{ margin:0; font-size:.88rem; }

  /* ---------- Shared pieces ---------- */
  .crumb{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:.86rem; color:var(--ink-soft); margin-bottom:16px; }
  .crumb button{ background:none; border:none; color:var(--ink-soft); padding:2px 0; font-size:.86rem; text-decoration:underline; text-underline-offset:3px; }
  .crumb button:hover{ color:var(--acc); }
  .crumb span.sep{ color:var(--faint); }
  .crumb span.current{ color:var(--ink); font-weight:700; }

  .paper-banner{
    background:var(--acc); color:#fff; border-radius:16px; padding:18px 20px; margin-bottom:18px;
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
  }
  :root[data-theme="dark"] .paper-banner{ color:#0E1321; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .paper-banner{ color:#0E1321; } }
  .paper-banner h2{ font-family:var(--font-display); font-size:1.6rem; font-weight:700; margin:0; }
  .paper-banner .subtitle{ font-size:1rem; opacity:.9; }
  .paper-banner .tag{ font-family:var(--font-mono); font-size:.74rem; opacity:.85; margin-top:4px; }
  .paper-banner .bprog{ min-width:200px; flex:0 1 260px; font-size:.82rem; font-weight:600; }
  .paper-banner .bprog .bar{ background:rgba(255,255,255,.3); margin-top:6px; }
  .paper-banner .bprog .bar i{ background:#fff; }
  :root[data-theme="dark"] .paper-banner .bprog .bar{ background:rgba(0,0,0,.2); }
  :root[data-theme="dark"] .paper-banner .bprog .bar i{ background:#0E1321; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .paper-banner .bprog .bar{ background:rgba(0,0,0,.2); }
    :root:not([data-theme="light"]) .paper-banner .bprog .bar i{ background:#0E1321; }
  }

  .list-head{ font-family:var(--font-display); font-size:1.15rem; font-weight:700; margin:20px 0 6px; }
  .topic-help{ color:var(--ink-soft); font-size:.95rem; line-height:1.55; max-width:62ch; margin:0 0 14px; }
  .topic-list{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; margin-bottom:26px; }
  @media (max-width:640px){ .topic-list{ grid-template-columns:1fr; } }
  .topic-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-family:var(--font-sans); font-size:.97rem; color:var(--ink);
  }
  .topic-row:hover{ border-color:var(--acc); }
  .topic-row .num{
    font-family:var(--font-mono); font-size:.76rem; font-weight:600; flex:none; min-width:34px; height:30px; padding:0 6px;
    display:grid; place-items:center; border-radius:8px; background:var(--acc-bg); color:var(--acc);
  }
  .topic-row.is-done .num{ background:var(--acc); color:var(--surface); }
  .topic-row .name{ flex:1; font-weight:600; line-height:1.3; }
  .topic-row .arrow{ color:var(--acc); font-weight:700; }
  .topic-row.off{ color:var(--faint); cursor:default; }
  .ready-tag, .done-tag, .soon-tag{ display:inline-block; font-size:.68rem; font-weight:700; letter-spacing:.04em; margin-left:8px; padding:1px 7px; border-radius:99px; vertical-align:1px; }
  .ready-tag{ display:none; }
  .done-tag{ background:var(--teal-bg); color:var(--teal); }
  .soon-tag{ background:var(--surface-2); color:var(--faint); }

  .mock-panel{
    background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 18px; margin-bottom:18px;
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .mock-panel h3{ font-family:var(--font-display); font-weight:700; font-size:1.05rem; margin:0 0 4px; }
  .mock-panel p{ margin:0; font-size:.86rem; color:var(--ink-soft); max-width:60ch; line-height:1.5; }
  .mock-panel button, .mock-panel a.btn-link{ background:var(--gold); color:#fff; border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:.86rem; text-decoration:none; flex:none; }
  :root[data-theme="dark"] .mock-panel a.btn-link, :root[data-theme="dark"] .mock-panel button{ color:#0E1321; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .mock-panel a.btn-link, :root:not([data-theme="light"]) .mock-panel button{ color:#0E1321; } }

  .part-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 18px; }
  @media (max-width:600px){ .part-grid{ grid-template-columns:1fr; } }
  .part-card{
    background:var(--surface); color:var(--ink); border:2px solid var(--line); border-radius:14px;
    padding:14px 16px; text-align:left; display:flex; flex-direction:column; gap:3px;
  }
  .part-card:hover:not(:disabled){ border-color:var(--acc); }
  .part-card.on{ border-color:var(--acc); background:var(--acc-bg); }
  .part-card:disabled{ opacity:.5; cursor:default; }
  .part-card small{ font-size:.74rem; color:var(--faint); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .part-card span{ font-family:var(--font-display); font-size:1.3rem; font-weight:700; color:var(--acc); }
  .part-card em{ font-style:normal; font-size:.8rem; color:var(--ink-soft); font-weight:700; }
  .part-card p{ margin:4px 0 0; font-size:.86rem; color:var(--ink-soft); line-height:1.5; }

  /* ---------- Topic page ---------- */
  .section-head{ background:var(--surface); border:1px solid var(--line); border-top:6px solid var(--acc); border-radius:16px; padding:18px 20px; margin-bottom:18px; }
  .section-head h2{ font-family:var(--font-display); font-weight:700; font-size:clamp(1.4rem, 3vw, 1.9rem); margin:0; line-height:1.15; }
  .section-head .tag{ font-family:var(--font-mono); font-size:.76rem; color:var(--acc); font-weight:600; display:block; margin-top:6px; }
  .head-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .head-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .done-btn{ border-radius:10px; padding:9px 14px; font-weight:700; font-size:.86rem; border:2px solid var(--teal); background:none; color:var(--teal); }
  .done-btn.on{ background:var(--teal); color:var(--surface); }

  .topic-nav{
    position:sticky; top:calc(env(safe-area-inset-top,0px) + 8px); z-index:5;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    padding:8px 10px; margin-bottom:16px;
  }
  @media (max-width:880px){ .topic-nav{ position:static; } }

const DATA = {
  paper1: { tag:'p1', title:'Paper 1', sections: [
    { id:'t1', title:T1, topics: [
      {id:'1.1', title:'1.1 Nature of economics',
       tutorial:"Economics studies how scarce resources are allocated to meet unlimited wants. Because resources (land, labour, capital, enterprise \u2014 the factors of production) are finite while wants are infinite, every decision involves an opportunity cost: the value of the next best alternative given up. Positive economics deals with objective, testable statements; normative economics involves value judgements. Economies vary in how they answer the three basic economic questions \u2014 what, how, and for whom to produce \u2014 ranging from free market economies through mixed economies (most real-world economies) to planned/command economies.\n\nA production possibility frontier (PPF) shows the maximum combinations of two goods an economy can produce with fixed resources and technology. Points inside the curve show unemployed/underused resources; points on the curve show productive efficiency; points outside are unattainable without economic growth (an outward shift of the PPF). Movement along the PPF illustrates opportunity cost directly.\n\nSpecialisation \u2014 individuals, firms or countries concentrating on producing what they are relatively best at \u2014 combined with the division of labour raises productivity but increases dependency on trade. Money performs four functions: medium of exchange, store of value, unit of account, and standard for deferred payment, allowing economies to move beyond inefficient barter.",
       qa:[
        {marks:4,q:"Define opportunity cost and use an example to illustrate it for a student deciding how to spend a free evening.",
         a:`<p>Opportunity cost is <strong>the value of the next best alternative that is given up whenever a choice is made</strong>. Because resources are scarce, choosing one option always means forgoing something else.</p>
<p>For a student deciding how to spend a free evening, the opportunity cost of choosing to revise economics is the benefit of whatever they would otherwise have done \u2014 for example, working a part-time shift, or an evening of leisure. If the next best alternative was paid work worth £30, then the opportunity cost of that evening of revision is the £30 of income forgone, plus any enjoyment lost.</p>
<p>This example shows why the concept matters: because time, like all resources, is scarce relative to everything a student could do with it, every choice necessarily means giving something else up.</p>`},
        {marks:8,q:"Using a production possibility frontier diagram, explain how economic growth can be illustrated and distinguished from a movement along the curve.",
         a:`<p>A production possibility frontier (PPF) plots the maximum combinations of two goods an economy can produce with its existing resources and technology \u2014 here, capital goods on the vertical axis and consumer goods on the horizontal axis. The curve bows outward because resources are not equally suited to producing both goods, so the opportunity cost of producing more of one rises as more of it is made.</p>
${D_PPF}
<p>A <strong>movement along</strong> the existing curve \u2014 for example from point A to a point producing more consumer goods and less capital goods \u2014 represents a reallocation of the economy's existing resources between the two goods. No growth has occurred; the opportunity cost of that reallocation is simply the capital goods given up.</p>
<p>Economic <strong>growth</strong>, by contrast, is shown by the whole PPF shifting outward (the dashed curve), so more of both goods can be produced at once. This could be caused by more resources becoming available (for example, immigration increasing the workforce) or by better technology raising productivity. The key distinction: a movement along the curve reflects a reallocation with an opportunity cost, while a shift of the whole curve reflects genuine growth in productive potential.</p>`},
        {marks:15,q:"Evaluate whether the price mechanism is always the most effective way of allocating an economy's scarce resources.",
         a:`<p><strong>The case for the price mechanism:</strong> price performs three functions \u2014 rationing scarce goods to those most willing and able to pay, signalling to producers where profitable opportunities lie, and providing the incentive for resources to move towards their most valued use. This allows resources to be allocated without costly central planning, and lets the economy respond quickly to changing tastes. A rise in demand for electric cars, for example, quickly signals manufacturers to devote more resources to producing them. Competition between firms also tends to drive innovation and keep costs down.</p>
<p><strong>The case against relying on the price mechanism alone:</strong> markets ignore externalities \u2014 costs or benefits falling on third parties are not reflected in price, so goods with negative externalities (like pollution) are over-produced, while goods with positive externalities (like education) are under-produced. Public goods, such as national defence, would not be provided at all by a pure market, because the free-rider problem removes anyone's incentive to pay for something they cannot be excluded from enjoying. The price mechanism also allocates to those who can pay rather than those in greatest need, which many would consider unfair.</p>
<p><strong>Evaluation:</strong> whether the price mechanism is the most effective allocator depends heavily on the type of good and market involved. For most private goods traded in competitive markets it works well. But for public goods, goods with significant externalities, or markets dominated by monopoly power, the free market allocates resources poorly and needs government correction. This is why almost every real economy is a mixed economy \u2014 using the price mechanism as the main tool while relying on government intervention to correct its failures, rather than depending on the price mechanism alone.</p>`}
       ]},
      {id:'1.2', title:'1.2 How markets work',
       tutorial:"The demand curve shows the quantity consumers are willing and able to buy at each price, sloping downward due to the substitution and income effects. Non-price determinants (shifting the whole curve) include income, tastes, prices of substitutes/complements, population and advertising. The supply curve shows quantity producers are willing to sell at each price, sloping upward; non-price determinants include production costs, technology, taxes/subsidies and number of firms. Market equilibrium occurs where demand equals supply; price rations, signals and incentivises resource reallocation.\n\nPrice elasticity of demand (PED) measures responsiveness of quantity demanded to a price change (%\u0394QD/%\u0394P); goods with few substitutes tend to be inelastic. Price elasticity of supply (PES) depends on spare capacity, time period, and factor mobility. Income elasticity of demand (YED) distinguishes normal goods (positive) from inferior goods (negative); cross elasticity (XED) distinguishes substitutes (positive) from complements (negative).\n\nConsumer surplus is the difference between what consumers are willing to pay and what they actually pay; producer surplus is the difference between what producers receive and the minimum they would accept \u2014 together measuring the welfare a market generates at equilibrium.",
       qa:[
        {marks:4,q:"Calculate the price elasticity of demand for a good whose price rises from \u00a310 to \u00a312, causing quantity demanded to fall from 200 to 170 units, and comment on what this value means.",
         a:`<p>%\u0394QD = (170\u2212200)/200 \u00d7 100 = \u221215%. %\u0394P = (12\u221210)/10 \u00d7 100 = 20%.</p>
<p>PED = \u221215 \u00f7 20 = <strong>\u22120.75</strong>.</p>
<p>Because the value's size (ignoring the sign) is less than 1, demand is <strong>price inelastic</strong> here \u2014 quantity demanded changes proportionately less than price does, so a 20% price rise only reduces quantity demanded by 15%.</p>`},
        {marks:8,q:"Explain, using a diagram, how an increase in the price of a complementary good would affect the market for the good in question.",
         a:`<p>Complements are goods consumed together, so a rise in the price of one reduces demand for the other \u2014 for example, a rise in the price of printers reduces demand for printer ink, because people buy fewer printers and therefore need less ink to go with them.</p>
${D_DEMAND}
<p>The diagram shows the original equilibrium at E1. Following the price rise in the complement, the whole demand curve for the good in question shifts left, from D1 to D2, because at every price consumers now want to buy less. This gives a new, lower equilibrium at E2, with both the equilibrium price and quantity falling from P1,Q1 to P2,Q2.</p>`},
        {marks:12,q:"Assess the factors that determine the price elasticity of supply of a manufactured good such as furniture.",
         a:`<p><strong>Spare capacity:</strong> a furniture firm with unused factory space and machinery can raise output quickly without rising costs when price increases, making supply elastic. A firm already working at full capacity cannot respond as easily, making supply more inelastic.</p>
<p><strong>Time period:</strong> supply tends to be far more elastic in the long run, once firms can build new factories, hire more workers and source more raw materials. In the short run, at least one factor (such as factory size) is fixed, so supply is more inelastic.</p>
<p><strong>Ease of factor mobility:</strong> if skilled carpenters and specialist machinery can be easily hired or reallocated from other uses, supply responds more elastically to a price change.</p>
<p><strong>Stock levels:</strong> firms holding finished-goods inventory can release stock quickly in response to a price rise, making supply more elastic in the short term than a firm with no stock.</p>
<p><strong>Judgement:</strong> for furniture specifically, the time period is often the decisive factor \u2014 factories and skilled labour cannot be expanded overnight, so even with some spare capacity, short-run supply elasticity tends to be low, rising considerably over the long run.</p>`}
       ]},
      {id:'1.3', title:'1.3 Market failure',
       tutorial:"Market failure occurs when the free market fails to allocate resources efficiently. Externalities are costs or benefits affecting third parties not reflected in price. Negative production externalities (e.g. pollution) mean marginal social cost exceeds marginal private cost, causing over-production; negative consumption externalities (e.g. smoking) mean marginal social benefit is below marginal private benefit. Positive externalities (e.g. education, vaccination) cause under-production/consumption relative to the social optimum.\n\nPublic goods are non-excludable and non-rival (e.g. street lighting, defence), leading to the free-rider problem where the market fails to provide them at all. Information gaps/asymmetric information (e.g. used cars, insurance) cause adverse selection and moral hazard. Factor immobility (geographical or occupational) prevents resources moving to where most valued, causing structural unemployment. Monopoly power is also a source of market failure, since a profit-maximising monopolist restricts output and raises price above the competitive level, creating a deadweight welfare loss.",
       qa:[
        {marks:4,q:"Distinguish between a public good and a private good, giving one example of each.",
         a:`<p>A <strong>private good</strong> is both excludable (non-payers can be stopped from consuming it) and rival (one person's consumption reduces what's left for others) \u2014 for example, a sandwich.</p>
<p>A <strong>public good</strong> is non-excludable and non-rival \u2014 for example, a lighthouse or street lighting. Because no one can be prevented from benefiting once it exists, and one person's use doesn't reduce another's, the free market fails to provide public goods at all \u2014 this is the free-rider problem.</p>`},
        {marks:9,q:"Using a diagram, explain how a negative production externality leads to market failure.",
         a:`<p>When production creates a cost that falls on third parties \u2014 for example, pollution from a factory affecting nearby residents \u2014 the marginal social cost (MSC) of production is higher than the marginal private cost (MPC) that the firm actually pays.</p>
${D_EXT}
<p>The free market equilibrium occurs where MPC meets demand, at Q1, because the firm only takes its own private costs into account. The socially efficient output is where MSC meets demand, at Q2, which is lower than Q1. This shows the market <strong>over-produces</strong> the good relative to the social optimum, because producers don't bear the full cost of what they make. The shaded triangle represents the welfare loss created by producing the extra units between Q2 and Q1, where the social cost of each unit exceeds its social benefit.</p>`},
        {marks:15,q:"Evaluate the view that information gaps are the most significant cause of market failure in modern economies.",
         a:`<p><strong>For:</strong> information gaps affect major markets such as healthcare, financial services and used goods. Akerlof's "market for lemons" shows how adverse selection (only high-risk buyers seeking insurance) and moral hazard (less careful behaviour once insured) can shrink or even destroy a market entirely. Increasingly complex modern products \u2014 financial derivatives, digital subscriptions \u2014 arguably make information asymmetry more significant than in the past.</p>
<p><strong>Against:</strong> externalities, particularly climate change, arguably cause far larger and more global welfare losses than information gaps, and affect virtually every market in some way. Public goods failures can be catastrophic where they occur, for example under-provision of basic infrastructure. Monopoly power in increasingly concentrated digital markets may also be a highly significant modern cause of failure.</p>
<p><strong>Evaluation:</strong> significance really depends on which market is being examined \u2014 information gaps are highly damaging in specific markets like healthcare and used cars, but externalities such as climate change likely cause greater aggregate welfare loss across the whole economy. A reasoned conclusion should weigh the scale and reach of each cause rather than simply restating the question.</p>`}
       ]},
      {id:'1.4', title:'1.4 Government intervention',
       tutorial:"Governments intervene to correct market failure. Indirect taxes raise production costs, shifting supply left to internalise a negative externality; effectiveness depends on elasticity of demand and black-market risk. Subsidies lower costs, shifting supply right to encourage goods with positive externalities. Maximum prices (below equilibrium) improve affordability but risk shortages/black markets; minimum prices (above equilibrium) protect producers/workers but risk surpluses. Tradable pollution permits cap total emissions while letting firms trade spare allowances, rewarding efficient abatement.\n\nState provision directly supplies goods under-provided by the market (e.g. NHS, state education). Regulation sets legal limits backed by fines but can be costly to enforce. Nudge theory/behavioural economics uses insights into actual decision-making (bounded rationality, present bias, defaults) to change behaviour cheaply without banning choices. However, intervention risks government failure: imperfect information, regulatory capture, unintended consequences, and administrative cost.",
       qa:[
        {marks:5,q:"Explain one advantage and one disadvantage of using a maximum price to make housing more affordable.",
         a:`<p><strong>Advantage:</strong> setting a maximum price below the free-market equilibrium directly reduces what tenants pay, improving affordability and access for lower-income households who might otherwise be priced out of the housing market entirely.</p>
<p><strong>Disadvantage:</strong> because the price is held below equilibrium, quantity supplied falls short of quantity demanded \u2014 landlords are less willing to offer housing at the lower price, creating a shortage. This can lead to non-price rationing, such as long waiting lists, or the emergence of black markets and informal top-up payments, undermining the policy's original goal.</p>`},
        {marks:10,q:"Using a diagram, analyse the impact of a specific (per-unit) indirect tax on a good with inelastic demand.",
         a:`<p>A specific indirect tax adds a fixed amount to the cost of each unit produced, shifting the supply curve vertically upward by the size of the tax.</p>
${D_TAX}
<p>Because demand is drawn steep (inelastic) in this diagram, the price rise from P1 to P2 is large relative to the fall in quantity from Q1 to Q2 \u2014 consumers keep buying nearly as much as before even at the higher price. This means most of the <strong>tax burden falls on consumers</strong> rather than producers, and the government raises substantial tax revenue. The deadweight welfare loss is small, because the inelastic demand means the tax barely reduces the quantity consumed \u2014 which is exactly why governments often choose to tax inelastic goods such as tobacco or fuel: it raises revenue reliably, even though it may do relatively little to reduce consumption of the good itself.</p>`},
        {marks:20,q:"Discuss the extent to which government intervention is the most effective solution to market failure caused by negative externalities.",
         a:`<p><strong>The case for intervention:</strong> taxes and regulation directly internalise the externality by raising the private cost of the activity towards its true social cost (Pigouvian tax theory), and can raise revenue to fund mitigation \u2014 for example, tobacco tax revenue partly funding NHS treatment for smoking-related illness. Regulation and bans provide certainty where a tax alone might not sufficiently reduce harmful behaviour. Tradable pollution permits let the market itself find the cheapest way of hitting an overall emissions target, rewarding the firms that can cut pollution most efficiently.</p>
<p><strong>The limitations of intervention:</strong> government failure is a real risk \u2014 regulators rarely know the true size of an externality, so a tax may be set too high or too low. Taxes on goods with very inelastic demand, like tobacco, may raise revenue without meaningfully reducing the externality-generating behaviour, and can be regressive, falling disproportionately on lower-income households. Regulation is often costly to monitor and enforce, and firms or consumers may find ways around it, for example through black markets.</p>
<p><strong>Evaluation:</strong> the most effective solution likely depends on the type and scale of the externality, the elasticities of demand and supply involved, and how much reliable information policymakers actually have. In practice, a combination of instruments \u2014 rather than any single "most effective" solution \u2014 is usually optimal: for example, using tradable permits alongside targeted regulation. It would be an overstatement to claim government intervention is always superior to the market outcome; the case needs to be made externality by externality.</p>`}
       ]}
    ]},
    { id:'t3', title:T3, topics: [
      {id:'3.1', title:'3.1 Business growth',
       tutorial:"Firms grow to exploit economies of scale, increase market power/profits, or satisfy managerial ambition, while some stay small due to limited market size, owner preference for control, or lack of finance access. Growth can be organic (reinvesting profits \u2014 slower, lower-risk) or inorganic, through mergers and acquisitions (faster, riskier). Mergers are horizontal (same industry/stage), vertical (same industry, different stage \u2014 forward or backward) or conglomerate (unrelated industries, diversifying risk).\n\nDemergers occur when a firm splits into separate parts, often to focus each division on its core competency, unlock shareholder value (avoiding a 'conglomerate discount'), meet regulatory requirements, or raise cash. Constraints on growth include the size of the market, access to finance, owners' objectives, and regulatory barriers (e.g. competition authorities blocking a merger).",
       qa:[
        {marks:4,q:"Distinguish between organic and inorganic growth, giving an example of each.",
         a:`<p><strong>Organic (internal) growth</strong> happens when a firm expands using its own resources and profits \u2014 for example, opening new stores funded by retained earnings.</p>
<p><strong>Inorganic (external) growth</strong> happens through merging with or acquiring another firm \u2014 for example, one supermarket chain buying a rival chain. Organic growth tends to be slower but lower-risk, while inorganic growth is faster but carries greater integration risk.</p>`},
        {marks:8,q:"Explain, with an example, why a firm might choose backward vertical integration.",
         a:`<p>Backward vertical integration means merging with or acquiring a firm at an <strong>earlier</strong> stage of the same production process \u2014 essentially, buying one of your own suppliers.</p>
<p>This secures the supply and quality of key inputs, removing reliance on an external supplier who might raise prices or fail to deliver on time. It can also let the firm capture the profit margin the supplier previously earned, potentially lowering overall costs.</p>
<p>Example: a coffee shop chain acquiring a coffee plantation or processor guarantees the quality and consistency of its beans, secures supply against price spikes, and keeps the margin the plantation used to earn for itself.</p>`},
        {marks:12,q:"Evaluate the reasons why a large conglomerate business might choose to demerge into separate companies.",
         a:`<p><strong>Reasons to demerge:</strong> splitting up allows each resulting business to focus management attention and resources on its own core competency, rather than spreading expertise thinly across unrelated markets, which can improve efficiency and profitability. It can unlock shareholder value if the conglomerate is trading at a "conglomerate discount", where investors undervalue diversified firms because they are harder to analyse. It may also be required by competition authorities concerned about excessive market dominance, or used simply to raise cash by selling off a division.</p>
<p><strong>Costs of demerging:</strong> the firm loses the risk-diversification benefit of a conglomerate structure, since poor performance in one market can no longer be offset by strong performance in another. It also loses any genuine synergies or economies of scope, such as shared resources or cross-selling opportunities between divisions, and restructuring itself is often costly and disruptive.</p>
<p><strong>Evaluation:</strong> whether demerger makes sense really depends on whether the conglomerate has genuine synergy between its divisions, or whether the market has simply mispriced it. Where real synergies exist, demerging can destroy more value than it creates; where divisions are largely unrelated, demerging is more likely to improve overall performance.</p>`}
       ]},
      {id:'3.2', title:'3.2 Business objectives',
       tutorial:"The traditional theory of the firm assumes profit maximisation, where output is set where marginal cost equals marginal revenue (MC=MR). Alternative objectives are common where ownership is separated from control (the principal-agent problem). Revenue maximisation occurs where MR=0; sales (volume) maximisation occurs where AR=AC (normal profit only), potentially to build market share/deter entry. Satisficing describes firms setting 'good enough' targets across multiple objectives rather than strictly maximising one.\n\nManagerial theories (e.g. Baumol, Williamson) explain why managers might pursue growth, salary, status or a 'quiet life' instead of shareholder profit, especially where shareholders cannot closely monitor decisions \u2014 the principal-agent problem, mitigated through performance-related pay, share options or better corporate governance.",
       qa:[
        {marks:4,q:"State the profit-maximising rule and explain its logic.",
         a:`<p>Profit is maximised where <strong>marginal cost equals marginal revenue (MC=MR)</strong>.</p>
<p>Below this output, each extra unit sold adds more to revenue than it costs to produce, so making it increases total profit. Beyond this output, each extra unit costs more to produce than it earns in revenue, so making it would reduce profit. MC=MR therefore identifies the exact output level at which profit is at its highest.</p>`},
        {marks:8,q:"Explain why a divorce of ownership from control might lead a firm to pursue revenue maximisation rather than profit maximisation.",
         a:`<p>In large firms, shareholders (the owners, or "principals") typically don't run the business day-to-day \u2014 they delegate this to professional managers ("agents"). This creates the <strong>principal-agent problem</strong>: managers may have different incentives to shareholders, for example wanting higher status, bonuses or job security linked to the size or turnover of the firm rather than its profit.</p>
<p>Because shareholders often cannot closely monitor every managerial decision (they lack the same detailed information managers have), managers have room to pursue their own goals instead. This can lead them to choose <strong>revenue maximisation</strong>, setting output where MR=0, which typically results in a larger, higher-turnover firm than the profit-maximising level of output \u2014 good for managerial prestige, but not for maximising shareholder returns.</p>`},
        {marks:12,q:"Assess the view that all private sector firms ultimately aim to maximise profit.",
         a:`<p><strong>For:</strong> profit maximisation remains a necessary condition for long-run survival, since persistent losses would eventually force a firm out of the market. Shareholders, as the legal owners, generally expect returns and can exert pressure through voting rights, the share price, or the threat of a takeover if management consistently underperforms on profit.</p>
<p><strong>Against:</strong> satisficing behaviour is common, especially in small or family-run firms balancing profit against lifestyle, control or personal values. Managerial and behavioural theories show that where ownership and control are separated, managers may instead pursue growth, revenue, or simply an easier working life. Many firms also now explicitly cite corporate social responsibility and stakeholder considerations \u2014 employees, the environment, long-run reputation \u2014 as objectives that can override short-run profit.</p>
<p><strong>Evaluation:</strong> the extent to which profit maximisation dominates likely depends on the firm's size and ownership structure, how competitive its market is (competition forces firms closer to profit-maximising behaviour, since inefficient firms cannot survive), and the time horizon under consideration. A single yes/no answer oversimplifies a picture that varies considerably across firms.</p>`}
       ]},
      {id:'3.3', title:'3.3 Revenues, costs and profits',
       tutorial:"Total revenue (TR) = price \u00d7 quantity; average revenue (AR) = TR/Q; marginal revenue (MR) is the extra revenue from one more unit. In the short run at least one factor is fixed; in the long run all factors are variable. Total cost = fixed cost (unchanged with output) + variable cost (changes with output); average cost (AC) = TC/Q; marginal cost (MC) is the extra cost of one more unit. The law of diminishing returns explains why short-run MC eventually rises: adding more of a variable factor to a fixed factor eventually yields smaller extra output per unit added.\n\nIn the long run, economies of scale (falling long-run average cost as output rises) arise from purchasing, technical, managerial, financial and risk-bearing economies (internal) plus external economies from industry growth. Beyond a point, diseconomies of scale (coordination/communication problems) can raise long-run average cost. Normal profit (AR=AC) is the minimum return to keep resources in current use, treated as a cost; supernormal profit occurs where AR>AC; a loss where AR<AC.",
       qa:[
        {marks:4,q:"Calculate the marginal cost of producing the 6th unit of output, given total cost at 5 units is \u00a3220 and at 6 units is \u00a3255.",
         a:`<p>Marginal cost is the change in total cost divided by the change in quantity.</p>
<p>MC = (255 \u2212 220) \u00f7 (6 \u2212 5) = 35 \u00f7 1 = <strong>\u00a335</strong>.</p>`},
        {marks:9,q:"Using a diagram, explain why a firm's short-run marginal cost curve is typically U-shaped.",
         a:`<p>In the short run, at least one factor of production \u2014 typically capital, such as factory size or machinery \u2014 is fixed. As the firm adds units of a variable factor, such as labour, to this fixed factor, output initially rises quickly because of greater specialisation and division of labour, which pulls marginal cost down.</p>
${D_COST}
<p>Beyond a certain point, however, the <strong>law of diminishing marginal returns</strong> applies: each additional worker adds progressively less extra output than the one before, because the fixed factor becomes a constraint \u2014 for example, workers start queuing for limited machinery. As output per extra worker falls, marginal cost rises again, giving the curve its U shape, with MC crossing both AVC and AC exactly at their lowest points.</p>`},
        {marks:10,q:"Analyse the internal economies of scale that a large manufacturing firm might benefit from as it expands.",
         a:`<p><strong>Purchasing (bulk-buying) economies:</strong> larger firms can negotiate lower prices per unit of raw material because of the size of their orders, lowering average variable cost.</p>
<p><strong>Technical economies:</strong> large-scale production allows the use of more efficient, specialised machinery and production-line techniques that wouldn't be worth installing at smaller scale, spreading the cost of expensive equipment across many more units.</p>
<p><strong>Managerial economies:</strong> a larger firm can afford to employ specialist managers or whole departments \u2014 finance, marketing, HR \u2014 rather than a few generalists trying to cover everything, improving decision-making and efficiency.</p>
<p><strong>Financial economies:</strong> larger, more established firms typically borrow at lower interest rates or raise finance more cheaply than small firms, because lenders see them as lower risk.</p>
<p>Together, these economies explain why long-run average cost tends to fall as a manufacturing firm grows \u2014 though only up to the point where diseconomies of scale, such as coordination and communication problems, begin to outweigh these benefits.</p>`}
       ]},
      {id:'3.4', title:'3.4 Market structures',
       tutorial:"Perfect competition (a benchmark) assumes many small firms, homogeneous products, perfect information and free entry/exit; firms are price takers earning only normal profit long run. Monopolistic competition has many firms with slightly differentiated products, some price-setting power, low entry barriers, and normal profit long run. Oligopoly is dominated by a few interdependent firms; the kinked demand curve explains price rigidity (elastic above the kink as rivals won't follow a price rise, inelastic below as rivals match a cut). Game theory (e.g. the prisoner's dilemma) shows interdependent firms may reach a worse joint outcome than cooperation would allow.\n\nMonopoly exists where a single firm dominates (25%+ market share in the UK), protected by high barriers to entry; it can restrict output, raise price above the competitive level, and price discriminate (charging different prices based on differing elasticities). A monopsony is a market with a single/dominant buyer with power over suppliers. Contestability (the threat of entry) can discipline monopoly/oligopoly behaviour if barriers to entry/exit, especially sunk costs, are low.",
       qa:[
        {marks:4,q:"Identify two characteristics of an oligopolistic market structure.",
         a:`<p><strong>1. A small number of large firms dominate the market</strong> \u2014 measured by a high concentration ratio, meaning the biggest few firms account for most of total sales.</p>
<p><strong>2. Firms are interdependent</strong> \u2014 each firm must consider how rivals are likely to react before changing its own price or output. Other acceptable characteristics include high barriers to entry, significant non-price competition, and the potential for collusion.</p>`},
        {marks:9,q:"Using the kinked demand curve model, explain why prices in an oligopolistic market may be relatively stable.",
         a:`<p>The kinked demand curve model assumes rivals react differently depending on whether a firm raises or lowers its price.</p>
${D_KINK}
<p>If a firm raises its price above the current level, rivals are assumed <strong>not</strong> to follow, so demand for the firm's product is relatively elastic above the kink \u2014 the firm loses significant market share, making a price rise unprofitable. If a firm cuts its price below the current level, rivals are assumed to match the cut to avoid losing market share, so demand is relatively inelastic below the kink \u2014 the firm gains little extra market share while earning less revenue per unit sold.</p>
<p>Because both a price rise and a price cut tend to leave the firm worse off, firms have little incentive to change price at all, which helps explain the price rigidity often observed in oligopolistic markets, even when costs change modestly.</p>`},
        {marks:20,q:"Discuss whether firms operating in a monopoly market structure always act against the interests of consumers.",
         a:`<p><strong>Against consumers:</strong> a profit-maximising monopolist restricts output and charges a higher price than would prevail under competition, because it sets output where MC=MR rather than where MC=AR (price). This creates a deadweight welfare loss. Without competitive pressure, monopolists may also have less incentive to innovate or minimise costs (known as X-inefficiency), and can use price discrimination to extract extra consumer surplus from groups with more inelastic demand.</p>
<p><strong>In favour of monopoly:</strong> significant economies of scale, available to a large monopolist, can lower average costs enough that consumers end up paying less than they would under many smaller, less efficient competing firms. Supernormal profits can fund large-scale research and development \u2014 pharmaceutical patents, for example, use a temporary legal monopoly to incentivise the huge cost of developing new drugs. Contestable markets theory also suggests that even a monopolist may behave competitively if barriers to entry and exit are low, due to the constant threat of "hit-and-run" entry by new firms.</p>
<p><strong>Evaluation:</strong> the real impact on consumers depends on the extent of the firm's market power, how contestable the market actually is, whether supernormal profits are reinvested productively, and whether effective regulation exists to constrain abuse. It would be an overstatement to say monopoly is always against consumers' interests \u2014 the balance depends heavily on these context-specific factors rather than market structure alone.</p>`}
       ]},
      {id:'3.5', title:'3.5 The labour market',
       tutorial:"Demand for labour is a derived demand, depending on demand for the good/service labour produces. Firms hire up to where marginal revenue product (MRP = marginal physical product \u00d7 price of output) equals the wage rate, giving a downward-sloping labour demand curve. Labour supply to an occupation rises with wages plus non-monetary factors (conditions, training required, mobility). Equilibrium wage is set where labour demand equals supply in a competitive market.\n\nLabour market failure arises from monopsony power (a dominant employer can restrict employment and suppress wages below the competitive level), trade unions (can raise wages above equilibrium via collective bargaining), discrimination (paying below MRP due to prejudice), and factor immobility. A national minimum wage protects low-paid workers and can raise both wages and employment where it counters monopsony power, but in an otherwise competitive market risks unemployment if set above the market-clearing wage. A maximum wage controls costs but risks skill shortages.",
       qa:[
        {marks:4,q:"Explain what is meant by the term 'derived demand' in the context of the labour market.",
         a:`<p>Derived demand means demand for labour is not wanted for its own sake \u2014 it depends on, or is "derived from", demand for the good or service that labour is used to produce.</p>
<p>For example, demand for construction workers depends on demand for new housing. If demand for housing falls, so does demand for construction labour, even though nothing has changed about construction workers themselves.</p>`},
        {marks:9,q:"Using a diagram, explain how a monopsony employer can pay workers a wage below their marginal revenue product.",
         a:`<p>A monopsonist is the sole or dominant buyer of labour in a market, so it faces the whole upward-sloping market supply curve rather than a fixed wage it must simply accept.</p>
${D_MONOPSONY}
<p>Because hiring one extra worker means raising the wage paid to <strong>all</strong> existing workers (not just the new one), the marginal cost of labour (MC(L)) lies above the supply curve (average cost of labour). The profit-maximising monopsonist hires where MC(L)=MRP, giving employment level Le \u2014 but the wage actually paid, read off the supply curve at that employment level, is We, which is below both the MRP and the wage a competitive market would set (Wc at Lc).</p>
<p>This shows how monopsony power gives an employer both the incentive and the ability to restrict employment and pay wages below the competitive level \u2014 a clear example of labour market failure.</p>`},
        {marks:15,q:"Evaluate the likely impact of a significant increase in the National Minimum Wage on the level of unemployment.",
         a:`<p><strong>Case for rising unemployment:</strong> in a competitive labour market, raising the minimum wage above the equilibrium wage creates an excess supply of labour \u2014 more people willing to work than firms wish to employ at the higher wage \u2014 particularly affecting low-skilled or younger workers whose marginal revenue product may sit below the new minimum. Over time, firms may also substitute towards automation to avoid the higher labour cost.</p>
<p><strong>Case for little or no rise in unemployment:</strong> where employers hold monopsony power \u2014 a single or dominant employer in a local labour market \u2014 a minimum wage set appropriately can raise both wages and employment towards the competitive level, because it removes the employer's incentive to restrict hiring in order to suppress wages. Higher wages can also improve worker productivity and motivation (efficiency wage theory) and reduce costly staff turnover, offsetting some of the extra wage cost. Empirical studies of past UK minimum wage increases have often found smaller employment effects than simple competitive-market theory would predict.</p>
<p><strong>Evaluation:</strong> the actual impact depends heavily on the structure of the specific labour market affected \u2014 competitive or monopsonistic \u2014 the size of the increase relative to typical wages in that sector, how sensitive labour demand is to wage changes in that industry, and whether firms can pass the extra cost on through higher prices rather than cutting jobs. A single, universal prediction of the employment effect is unlikely to be accurate across every UK labour market.</p>`}
       ]},
      {id:'3.6', title:'3.6 Government intervention (business & labour)',
       tutorial:"Competition policy aims to promote competitive markets and prevent abuse of market power. Merger policy (in the UK, the Competition and Markets Authority) can block or impose conditions on mergers that would substantially lessen competition. Regulation of monopolies can include price capping (e.g. RPI-X regulation for privatised utilities), profit caps, or quality standards, mimicking competitive outcomes where genuine competition is impractical. Privatisation is argued to improve efficiency via profit incentives; nationalisation may be favoured for natural monopolies or industries with high social importance. Deregulation removes barriers to entry to increase competition/contestability.\n\nIn labour markets, intervention includes minimum wage legislation, maximum wage/pay caps, and trade union legislation balancing collective bargaining rights against concerns about distorting competitive labour markets. All intervention risks government failure: imperfect information, regulatory capture, unintended consequences, and administrative cost.",
       qa:[
        {marks:5,q:"Explain one reason why a government might choose to nationalise a natural monopoly industry such as water supply.",
         a:`<p>A natural monopoly exists where very large fixed and infrastructure costs mean a single firm can serve the whole market at the lowest possible average cost, making genuine competition impractical \u2014 building several rival networks of water pipes, for example, would be hugely wasteful.</p>
<p>Nationalisation lets the government prioritise wider social objectives \u2014 universal access, long-term infrastructure investment, environmental standards \u2014 over the pure profit motive that a private monopoly might otherwise pursue at consumers' expense, precisely because there is no competitive pressure to keep it in check.</p>`},
        {marks:10,q:"Using an example, analyse how RPI-X price cap regulation aims to control the behaviour of a privatised monopoly.",
         a:`<p>RPI-X regulation requires a regulated firm to keep price rises below the rate of inflation (RPI) minus an efficiency factor (X), effectively forcing real-terms price cuts each year by the amount X, which the regulator sets based on the efficiency gains it expects the firm should be able to achieve.</p>
<p>Example: a water regulator might set X at 2%, meaning the firm's prices can rise by at most (RPI \u2212 2%) each year. This gives the firm a strong incentive to cut its costs by more than 2%, since any efficiency gains achieved above X can be kept as extra profit until the next regulatory price review \u2014 rewarding genuine efficiency. At the same time, consumers are protected from the excessive price rises an unregulated monopoly might otherwise impose, since the cap limits how much the firm can charge regardless of its actual costs.</p>`},
        {marks:15,q:"Evaluate the case for privatising state-owned industries in order to improve efficiency.",
         a:`<p><strong>For:</strong> private ownership creates a direct profit incentive for managers and owners to minimise costs and innovate, free of the "soft budget constraint" that lets loss-making state industries survive on government bailouts regardless of performance. Privatisation is also often accompanied by greater competition or deregulation in the industry, sharpening these incentives further, and access to private capital markets can fund investment without adding to government borrowing.</p>
<p><strong>Against:</strong> privatising a natural monopoly without effective, well-designed regulation risks simply replacing a public monopoly with an unregulated private one, free to restrict output and raise prices to maximise profit at consumers' expense. Industries with important externalities or universal-service obligations \u2014 rail, water, energy \u2014 may see under-investment or falling service quality if private owners prioritise short-run profit over long-run social benefit. There is also a risk of regulatory capture, where the regulator ends up acting in the interest of the industry it is supposed to be controlling.</p>
<p><strong>Evaluation:</strong> the efficiency gains from privatisation depend heavily on whether genuine competition can realistically be introduced into the industry, and where it cannot \u2014 as with most natural monopolies \u2014 on the quality and independence of the regulatory regime put in place. Privatisation without effective competition or regulation is unlikely to deliver the claimed efficiency benefits, so the case should really be assessed industry by industry rather than treated as a universal rule.</p>`}
       ]}
    ]}
  ]},
  paper2: { tag:'p2', title:'Paper 2', sections: [
    { id:'t2', title:T2, topics: [
      {id:'2.1', title:'2.1 Measures of economic performance',
       tutorial:"Economic performance is judged using four main macroeconomic indicators, alongside supplementary measures. Economic growth is measured by the percentage change in real GDP (national output adjusted for inflation); two consecutive quarters of negative growth is a common rule-of-thumb definition of recession. Inflation is measured mainly using the Consumer Prices Index (CPI), tracking the percentage change in the price of a representative 'basket' of goods and services; demand-pull inflation is caused by excess aggregate demand, cost-push inflation by rising production costs (wages, raw materials, energy) being passed on as higher prices. Unemployment is measured by the claimant count (those claiming unemployment-related benefits) or the internationally comparable ILO Labour Force Survey measure; types include frictional (short-term, between jobs), structural (long-term, mismatch of skills/location), cyclical/demand-deficient (caused by a fall in aggregate demand), and seasonal. The balance of payments records transactions with the rest of the world; the current account (trade in goods/services plus primary and secondary income) is most closely watched, with a persistent deficit meaning a country imports more than it exports.\n\nGDP has significant limitations as a measure of living standards: it excludes informal/unpaid economic activity, does not capture how income is distributed, ignores environmental damage, and takes no account of leisure time or wellbeing. Real GDP per capita and alternative measures such as the Human Development Index are often used alongside GDP for a fuller picture.",
       qa:[
        {marks:4,q:"The CPI index was 118.4 in January this year and 114.2 in January last year. Calculate the rate of CPI inflation over the year, and briefly state what this figure represents.",
         a:`<p>The rate of inflation is the percentage change in the price index over the period.</p>
<p>Inflation rate = (118.4 \u2212 114.2) \u00f7 114.2 \u00d7 100 = 4.2 \u00f7 114.2 \u00d7 100 = <strong>approximately 3.7%</strong>.</p>
<p>This means the average price of the CPI 'basket' of goods and services bought by a typical household rose by about 3.7% over the year \u2014 not that every individual price rose by exactly this amount, since some prices will have risen faster and others slower, or even fallen.</p>`},
        {marks:8,q:"Distinguish between structural and cyclical unemployment, using an example of each.",
         a:`<p><strong>Structural unemployment</strong> occurs when there is a long-term mismatch between the skills or location of unemployed workers and the jobs available, often following a decline in a particular industry \u2014 for example, coal miners becoming unemployed as the UK coal industry shrank, whose skills were not easily transferable to jobs in their local area. It tends to persist even when the wider economy is doing well.</p>
<p><strong>Cyclical (demand-deficient) unemployment</strong> occurs when a fall in aggregate demand during an economic downturn leads firms to cut production and lay off workers across the economy \u2014 for example, the rise in unemployment seen during a recession as consumer spending and investment fall. Unlike structural unemployment, it tends to fall away again once aggregate demand recovers.</p>`},
        {marks:15,q:"Evaluate whether GDP is a reliable measure of a country's standard of living.",
         a:`<p><strong>The case for GDP:</strong> real GDP per capita correlates closely with many things people value \u2014 higher-income countries tend to have better healthcare, longer life expectancy, more education and greater access to goods. It is measured consistently and internationally comparably, allowing straightforward comparison over time and between countries.</p>
<p><strong>The case against relying on GDP alone:</strong> GDP says nothing about how income is distributed \u2014 GDP could rise while most gains go to a small proportion of the population. It excludes unpaid work and the informal economy, ignores environmental damage from production, and takes no account of leisure time, life satisfaction, or political freedom.</p>
<p><strong>Evaluation:</strong> GDP remains a useful, broad indicator of economic activity reasonably well correlated with living standards nationally, but is not a complete or fully reliable measure of wellbeing alone \u2014 which is why economists look at it alongside measures like the Human Development Index or income inequality for a fuller picture.</p>`}
       ]},
      {id:'2.2', title:'2.2 Aggregate demand (AD)',
       tutorial:"Aggregate demand (AD) is the total demand for goods and services in an economy at a given price level, made up of consumption (C), investment (I), government spending (G) and net exports (X\u2212M): AD = C + I + G + (X\u2212M). Consumption, typically the largest component, depends mainly on disposable income, but also interest rates, consumer confidence, and household wealth. Investment \u2014 spending by firms on capital goods \u2014 is sensitive to interest rates and business confidence; the accelerator theory suggests investment is also driven by the rate of change of national income. Government spending is set through fiscal policy, while net exports depend on the exchange rate, competitiveness, and the state of the global economy.\n\nThe AD curve slopes downward for three reasons: the real balance (wealth) effect (a lower price level raises the real value of savings, encouraging spending), the interest rate effect (a lower price level lowers interest rates, encouraging borrowing/investment), and the international trade effect (a lower price level makes exports relatively cheaper, boosting net exports). A change in the price level causes a movement along AD; a change in C, I, G or (X\u2212M) not caused by the price level shifts the whole curve.",
       qa:[
        {marks:4,q:"State the equation for aggregate demand and identify which component is typically the largest in the UK economy.",
         a:`<p>Aggregate demand (AD) = C + I + G + (X \u2212 M), where C is consumption, I is investment, G is government spending, and (X \u2212 M) is net exports.</p>
<p><strong>Consumption (C)</strong> is typically the largest component, usually around 60% or more of total AD, since household spending makes up the bulk of everyday economic activity.</p>`},
        {marks:9,q:"Using a diagram, explain how a fall in interest rates is likely to affect the level of aggregate demand in an economy.",
         a:`<p>A fall in interest rates reduces the cost of borrowing and the reward for saving, likely increasing both consumption (saving becomes less attractive, borrowing cheaper) and investment (cheaper to borrow for capital projects, more projects become profitable).</p>
${D_ADAS}
<p>The diagram shows the initial equilibrium at price level P1 and output Y1. As lower interest rates raise consumption and investment, the whole AD curve shifts right, from AD1 to AD2, raising the price level to P2 and increasing real output to Y2, assuming the economy has spare capacity to expand output rather than prices rising with output unchanged.</p>`},
        {marks:15,q:"Evaluate the view that consumer confidence is the most significant determinant of the level of investment in an economy.",
         a:`<p><strong>For:</strong> investment is forward-looking \u2014 firms invest in new capacity because they expect future demand to justify it, and confidence is a strong leading indicator of that demand. A sharp fall in confidence can cause firms to postpone investment even before actual spending falls.</p>
<p><strong>Against:</strong> interest rates arguably matter as much or more, directly determining the cost of financing investment and the return a project needs. The accelerator theory suggests investment depends on the rate of change of national income rather than sentiment alone, and government policy (tax incentives, regulatory stability) can be decisive for large, long-term projects.</p>
<p><strong>Evaluation:</strong> confidence and interest rates are closely linked and both matter, but the cost of finance is often the more immediately decisive factor for whether a specific project goes ahead, since even a confident firm won't invest if the numbers don't work. No single factor dominates; the balance varies by industry and project.</p>`}
       ]},
      {id:'2.3', title:'2.3 Aggregate supply (AS)',
       tutorial:"Aggregate supply (AS) shows the total quantity of goods and services firms are willing and able to produce at each price level. Short-run aggregate supply (SRAS) is upward sloping, since firms can raise output relatively quickly using existing capacity more intensively, but rising marginal costs push the curve upward; SRAS shifts with changes in production costs \u2014 wages, raw material prices, and the exchange rate (a weaker pound raises import costs, shifting SRAS left).\n\nLong-run aggregate supply (LRAS) represents the economy's potential output once wages and prices have fully adjusted. The classical view holds LRAS is vertical at the economy's full-employment/potential output, since in the long run output depends only on the quantity and quality of factors of production and technology, not the price level. The Keynesian view draws LRAS with a flat section (significant spare capacity, output can rise without pressure on prices), an upward-sloping middle section (spare capacity used up, costs start rising), and a vertical section only at full employment. LRAS shifts right due to supply-side improvements \u2014 more factors of production (e.g. net migration, capital investment) or better quality/productivity (e.g. education, technology, deregulation).",
       qa:[
        {marks:4,q:"Define long-run aggregate supply (LRAS) and explain, in one sentence, why classical economists draw it as a vertical line.",
         a:`<p>LRAS is the total output an economy is capable of producing once wages and prices have fully adjusted \u2014 the economy's potential output.</p>
<p>Classical economists draw it as vertical because, in their view, long-run output depends only on the quantity and quality of factors of production and technology, not the price level, so a change in prices alone cannot raise real output beyond what the economy can actually produce.</p>`},
        {marks:9,q:"Using a diagram, explain the classical view of long-run aggregate supply.",
         a:`<p>The classical view holds that once all prices and wages have fully adjusted, real output depends entirely on the quantity and quality of factors of production and technology, not the general price level.</p>
${D_LRAS}
<p>LRAS is vertical at the full-employment output, Yfe. Because it is vertical, a rise in the price level (P1 to P2, driven by AD1 shifting to AD2) has no effect on real output in the long run \u2014 output eventually returns to Yfe once wages and prices adjust. Only a shift in LRAS itself, from more or better factors of production, can increase the economy's long-run potential output.</p>`},
        {marks:15,q:"Evaluate the effectiveness of supply-side policies in increasing an economy's long-run aggregate supply.",
         a:`<p><strong>For:</strong> education and training can raise labour productivity over time; infrastructure spending lowers firms' costs economy-wide; deregulation and tax incentives can encourage investment and entrepreneurship. These policies raise long-run growth without the demand-pull inflation a purely demand-side stimulus might cause, and can reduce structural unemployment.</p>
<p><strong>Limitations:</strong> supply-side policies typically take a long time to work \u2014 education investment may take a decade to show up in productivity \u2014 making them of little use for a short-run downturn. Market-based policies (e.g. cutting benefits) can increase inequality, and interventionist policies are often expensive.</p>
<p><strong>Evaluation:</strong> supply-side policies can be highly effective at raising long-run potential output, but effectiveness depends heavily on which specific policies are used and how much time is allowed. They are best seen as a long-term complement to demand management, not a short-run fix.</p>`}
       ]},
      {id:'2.4', title:'2.4 National income',
       tutorial:"The circular flow of income model shows income flowing between households, who supply factors of production to firms in exchange for income (wages, rent, interest, profit), and firms, who sell goods and services back to households. Income leaks out as withdrawals \u2014 savings (S), taxation (T), and imports (M) \u2014 and is injected back in through investment (I), government spending (G), and exports (X). National income is in equilibrium when injections equal withdrawals (I+G+X = S+T+M); if injections exceed withdrawals, national income rises, and vice versa.\n\nA change in injections has a magnified effect through the multiplier effect: extra spending creates income, some of which is re-spent, creating further rounds of income and spending. The multiplier's size depends on the marginal propensity to withdraw \u2014 the smaller the proportion withdrawn at each stage, the larger the multiplier, calculated as 1 \u00f7 (marginal propensity to withdraw). National income can be measured via the output method (value added by all industries), income method (all factor incomes) or expenditure method (all spending on final goods/services) \u2014 these should, in theory, give the same total.",
       qa:[
        {marks:4,q:"If the marginal propensity to consume in an economy is 0.75 and there are no other withdrawals, calculate the value of the multiplier.",
         a:`<p>Where MPC is 0.75 and there are no other withdrawals, the marginal propensity to withdraw (MPW) = 1 \u2212 MPC = 1 \u2212 0.75 = 0.25.</p>
<p>Multiplier = 1 \u00f7 MPW = 1 \u00f7 0.25 = <strong>4</strong>. An initial £1 increase in injections would eventually increase national income by a total of £4, once all rounds of re-spending have worked through the economy.</p>`},
        {marks:9,q:"Using a diagram of the circular flow of income, explain the difference between injections and withdrawals.",
         a:`<p>The circular flow shows income flowing between households, who supply factors of production, and firms, who pay for them and sell goods and services back to households.</p>
${D_CIRCULAR}
