<p><strong>The case for direct redistribution:</strong> as this scenario shows, growth alone does not guarantee that its benefits reach the poorest, especially where inequality is already high or rising; targeted policies \u2014 progressive taxation, cash transfers, minimum wage laws, and spending on education and healthcare for the poorest \u2014 can directly and more immediately improve the position of those in poverty, rather than waiting for growth to (possibly) "trickle down". Redistribution can also support future growth by improving human capital (health and education) among the poorest, who might otherwise be unable to invest in themselves.</p>
<p><strong>Evaluation:</strong> in practice, the two strategies work best as complements rather than substitutes \u2014 growth expands the total resources available, while redistribution and targeted social spending help ensure the poorest actually share in those gains, rather than being left behind as this country's rising Gini coefficient illustrates. A developing economy pursuing growth without any attention to distribution risks the outcome described in this scenario, while redistribution without underlying growth has a limited total pool of resources to redistribute \u2014 so an effective long-run poverty reduction strategy generally needs both, combined deliberately, rather than growth or redistribution pursued in isolation.</p>`}
       ]}
    ]}
  ]}
};

<script data-hub>

  const PAPERS = [

  function rng(seed){ let a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffle(arr, r){ const a = arr.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function band(m){ return m <= 6 ? 'short' : m <= 12 ? 'mid' : 'long'; }
  function bankOf(pid){
    const out = [];
    sectionsOf(pid).forEach(function(s, si){ s.topics.forEach(function(t){ t.qa.forEach(function(q, qi){
      out.push({key:t.id + '#' + qi, topicId:t.id, topic:topicName(t), sec:si, secTitle:secName(s), secLabel:secLabel(s), marks:q.marks, q:q.q, a:q.a, band:band(q.marks)});
    }); }); });

  }
  const paperMemo = {};
  function buildPaper(pid, version){
    const k = pid + ':' + version;
    if(paperMemo[k]) return paperMemo[k];
    const r = rng(version * 7919 + (pid === 'paper1' ? 11 : pid === 'paper2' ? 23 : 37));
    const bank = bankOf(pid);
    let chosen = null;
    for(let tries = 0; tries < 20000 && !chosen; tries++){
      const pick = [], used = {}, perTopic = {};
      const take = function(q){ pick.push(q); used[q.key] = 1; perTopic[q.topicId] = (perTopic[q.topicId] || 0) + 1; };
      const free = function(q){ return !used[q.key] && !(perTopic[q.topicId] >= 2); };
      if(pid === 'paper3'){
        // Each section: one 25-mark essay, one 10-mark question, then 6-mark questions to reach 100 overall
        [0, 1].forEach(function(si){
          const longs = shuffle(bank.filter(function(q){ return q.sec === si && q.marks === 25; }), r);
          if(longs[0] && free(longs[0])) take(longs[0]);
          const mids = shuffle(bank.filter(function(q){ return q.sec === si && q.band === 'mid' && free(q); }), r);
          if(mids[0]) take(mids[0]);
        });
        const shorts = shuffle(bank.filter(function(q){ return q.band === 'short' && free(q); }), r);
        for(let i = 0; i < shorts.length && sum(pick) < 100; i++){ if(sum(pick) + shorts[i].marks <= 100 && free(shorts[i])) take(shorts[i]); }
        const secMarks = [0, 1].map(function(si){ return sum(pick.filter(function(q){ return q.sec === si; })); });
        if(sum(pick) === 100 && secMarks[0] >= 40 && secMarks[1] >= 40) chosen = pick;
      } else {
        const nLong = r() < 0.5 ? 2 : 3;
        shuffle(bank.filter(function(q){ return q.band === 'long'; }), r).slice(0, nLong).forEach(take);
        const mids = shuffle(bank.filter(function(q){ return q.band === 'mid' && free(q); }), r);
        for(let i = 0; i < mids.length && sum(pick) < 78; i++){ if(free(mids[i])) take(mids[i]); }
        const shorts = shuffle(bank.filter(function(q){ return q.band === 'short' && free(q); }), r);
        for(let i = 0; i < shorts.length && sum(pick) < 100; i++){ if(sum(pick) + shorts[i].marks <= 100 && free(shorts[i])) take(shorts[i]); }
        const secMarks = [0, 1].map(function(si){ return sum(pick.filter(function(q){ return q.sec === si; })); });
        const nShort = pick.filter(function(q){ return q.band === 'short'; }).length;
        if(sum(pick) === 100 && secMarks[0] >= 30 && secMarks[1] >= 30 && nShort >= 3) chosen = pick;
      }
    }
    if(!chosen) chosen = bank.slice(0, 1);
    // Order: Paper 3 by section then marks; Papers 1 and 2 by length (short, then mid, then extended)
    const rankB = {short:0, mid:1, long:2};
    chosen.sort(function(a, b){
      if(pid === 'paper3') return a.sec - b.sec || a.marks - b.marks || a.topicId.localeCompare(b.topicId);
      return rankB[a.band] - rankB[b.band] || a.sec - b.sec || a.topicId.localeCompare(b.topicId);
    });
    const qs = chosen.map(function(q, i){
      const part = pid === 'paper3' ? (q.sec === 0 ? 'A' : 'B') : ({short:'A', mid:'B', long:'C'})[q.band];
      return Object.assign({}, q, {number:i + 1, section:part});
    });
    paperMemo[k] = qs;
    return qs;
  }
  function sum(list){ return list.reduce(function(t, q){ return t + q.marks; }, 0); }
  function sectionTitle(pid, s){
    if(pid === 'paper3') return s === 'A' ? 'Section A: Microeconomics' : 'Section B: Macroeconomics';
    return s === 'A' ? 'Section A: Short-answer questions' : s === 'B' ? 'Section B: Explain and analyse' : 'Section C: Extended answers';
  }

  // Marking guide in the style of Edexcel levels-based mark schemes
  function guideFor(m){
    if(m <= 6){
      const k = m >= 6 ? 2 : 1, ap = m >= 5 ? 2 : 1, an = m - k - ap;
      return '<p class="guide-lead">Points-based marking for a ' + m + '-mark question:</p><ul class="guide-list">' +
        '<li><b>Knowledge (up to ' + k + ')</b> an accurate definition or correct calculation.</li>' +
        '<li><b>Application (up to ' + ap + ')</b> using the example, data or context in the question.</li>' +
        '<li><b>Analysis (up to ' + an + ')</b> a developed chain of reasoning: cause, then effect, then consequence.</li></ul>';
    }
    const lv = m <= 12
      ? [[1, Math.round(m * 0.3), 'Isolated knowledge. Little or no application or reasoning. Any diagram is missing or inaccurate.'],
         [Math.round(m * 0.3) + 1, Math.round(m * 0.65), 'Relevant theory with some application and partly developed chains of reasoning. Any diagram is mostly accurate.'],
         [Math.round(m * 0.65) + 1, m, 'Accurate knowledge applied closely to the question, with well-developed chains of reasoning and an accurate, labelled diagram where one is needed. For "assess" or "evaluate", the top marks need a reasoned judgement.']]
      : [[1, Math.round(m * 0.2), 'Isolated knowledge with little relevance to the question. No evaluation.'],
         [Math.round(m * 0.2) + 1, Math.round(m * 0.45), 'Some relevant theory and application, but analysis is limited or one-sided. Evaluation is asserted rather than explained.'],
         [Math.round(m * 0.45) + 1, Math.round(m * 0.7), 'Good application and developed analysis, with a relevant diagram where appropriate. Some evaluation, but judgements are only partly supported.'],
         [Math.round(m * 0.7) + 1, m, 'Precise, well-applied analysis of both sides, with balanced evaluation (for example, it depends on elasticity, time period or context) leading to a supported final judgement.']];
    let h = '<p class="guide-lead">Levels for a ' + m + '-mark question. Find the level that best fits your answer, then choose a mark within it:</p><div class="table-wrap"><table class="levels"><tr><th>Level</th><th>Marks</th><th>What the answer shows</th></tr>';
    lv.forEach(function(l, i){ h += '<tr><td>' + (i + 1) + '</td><td>' + l[0] + '&ndash;' + l[1] + '</td><td>' + l[2] + '</td></tr>'; });
    return h + '</table></div>';
  }

  function examKey(pid){ return 'e9ec0_exam_' + pid; }
  function histKey(pid){ return 'e9ec0_examhist_' + pid; }
  function saveExam(){ if(state.exam) cacheSet(examKey(state.paperId), state.exam); }
  function examQs(){ return state.exam ? buildPaper(state.paperId, state.exam.version) : []; }
  function fmtTime(ms){ const t = Math.max(0, Math.floor(ms / 1000)); const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60; return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
  function isAnswered(n){ return !!(state.exam && (state.exam.answers[n] || '').trim()); }
  function countAnswered(){ return examQs().filter(function(q){ return isAnswered(q.number); }).length; }
  function markOf(n){ const m = state.exam.marks[n]; return (m === undefined || m === null) ? '' : m; }
  function unmarkedCount(){ return examQs().filter(function(q){ return markOf(q.number) === ''; }).length; }
  function runningTotal(){ return examQs().reduce(function(t, q){ const m = markOf(q.number); return t + (typeof m === 'number' ? m : 0); }, 0); }
  function newVersion(avoid){ let v; do { v = 1000 + Math.floor(Math.random() * 9000); } while(v === avoid); return v; }

  // ---------------- Navigation ----------------
  function go(view, pid, tid){
    state.view = view; state.paperId = pid || null; state.topicId = tid || null;
    if(view === 'topic') cacheSet(LAST_KEY, {pid:pid, tid:tid});
    if(view === 'exam'){ state.exam = cacheGet(examKey(pid)); state.confirmStop = false; state.confirmRestart = false; state.markWarn = 0; }
    render(); toTop();
  }
  function startExam(which){
    const old = state.exam ? state.exam.version : 0;
    const v = typeof which === 'number' ? which : which === 'same' && old ? old : newVersion(old);
    state.exam = {phase:'sitting', version:v, startedAt:Date.now(), endedAt:null, stopped:false, answers:{}, marks:{}, result:null};
    state.confirmStop = false; state.confirmRestart = false; state.markWarn = 0;
    saveExam(); render(); toTop();
  }
  function endSitting(stopped){
    const ex = state.exam;
    ex.phase = 'marking'; ex.stopped = stopped; ex.endedAt = Date.now();
    examQs().forEach(function(q){ if(!isAnswered(q.number) && markOf(q.number) === '') ex.marks[q.number] = 'na'; });
    state.confirmStop = false; state.markWarn = 0;
    saveExam(); render(); toTop();
  }
  function finishMarking(){
    const left = unmarkedCount();
    if(left){ state.markWarn = left; render(); return; }
    const ex = state.exam, qs = examQs();
    let gained = 0, attemptedMax = 0; const byTopic = {};
    qs.forEach(function(q){
      const m = markOf(q.number); if(typeof m !== 'number') return;
      gained += m; attemptedMax += q.marks;
      byTopic[q.topic] = byTopic[q.topic] || {got:0, max:0}; byTopic[q.topic].got += m; byTopic[q.topic].max += q.marks;
    });
    const max = sum(qs), basis = ex.stopped ? attemptedMax : max;
    const pct = basis ? Math.round(gained / basis * 100) : null, grade = pct === null ? null : gradeFor(pct);
    const tl = Object.keys(byTopic).map(function(t){ return {t:t, p:byTopic[t].got / byTopic[t].max}; });
    ex.result = {gained:gained, max:max, attemptedMax:attemptedMax, pct:pct, grade:grade,
      strong: tl.filter(function(x){ return x.p >= 0.7; }).sort(function(a, b){ return b.p - a.p; }).slice(0, 3).map(function(x){ return x.t; }),
      weak: tl.filter(function(x){ return x.p < 0.5; }).sort(function(a, b){ return a.p - b.p; }).slice(0, 3).map(function(x){ return x.t; }),
      timeTaken: ex.endedAt - ex.startedAt};
    ex.phase = 'done'; saveExam();
    const hist = cacheGet(histKey(state.paperId)) || [];
    hist.unshift({at:Date.now(), version:ex.version, gained:gained, max:max, attemptedMax:attemptedMax, pct:pct, grade:grade, stopped:ex.stopped});
    cacheSet(histKey(state.paperId), hist.slice(0, 20));
    render(); toTop();
  }

    });
    h += '</div>';
    h += '<div class="bottom-nav">' + (prev ? '<button class="step" data-action="open-topic" data-paper="' + p.id + '" data-topic="' + esc(prev.t.id) + '"><small>&larr; Previous topic</small><span>' + esc(topicName(prev.t)) + '</span></button>' : '<div class="spacer"></div>') +
      (next ? '<button class="step next" data-action="open-topic" data-paper="' + p.id + '" data-topic="' + esc(next.t.id) + '"><small>Next topic &rarr;</small><span>' + esc(topicName(next.t)) + '</span></button>' : '<div class="spacer"></div>') + '</div>';
    h += '<div class="bottom-links"><button class="ghost-btn" data-action="go-paper" data-paper="' + p.id + '">All ' + esc(p.title) + ' topics</button><button class="ghost-btn" data-action="go-home">Back to the dashboard</button><button class="ghost-btn" data-action="open-exam" data-paper="' + p.id + '">Sit a ' + esc(p.title) + ' exam paper</button></div>';
    return h;
  }

  // ---------------- Exam screens ----------------
  function renderExam(){
    const p = getPaper(state.paperId), ex = state.exam;
    let h = crumb([{label:'Dashboard', action:'go-home'}, {label:p.title, action:'go-paper', paper:p.id}, {label:'Exam paper', current:true}]);
    h += '<div class="section-head"><h2>' + esc(p.title) + ' exam paper</h2><span class="tag">' + esc(p.name) + ' &middot; 2 hours &middot; 100 marks' + (ex ? ' &middot; Paper ' + ex.version : '') + '</span></div>';
    if(!ex) return h + renderIntro(p);
    if(ex.phase === 'sitting') return h + renderSitting(p);
    if(ex.phase === 'marking') return h + renderMarking(p);
    return h + renderResult(p);
  }
  function sectionHead(pid, q, last){ return q.section === last ? '' : '<h3 class="exam-section">' + sectionTitle(pid, q.section) + '</h3>'; }

  function renderHistory(p){
    const hist = cacheGet(histKey(p.id)) || [];
    if(!hist.length) return '';
    let h = '<div class="panel"><h3>Your previous attempts at ' + esc(p.title) + '</h3><div class="table-wrap"><table class="hist"><tr><th>Date</th><th>Paper</th><th>How it ended</th><th>Mark</th><th>Grade</th><th></th></tr>';
    hist.forEach(function(x){
      h += '<tr><td>' + esc(new Date(x.at).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'})) + '</td><td>' + x.version + '</td><td>' + (x.stopped ? 'Stopped early' : 'Finished') + '</td>' +
        '<td>' + x.gained + ' / ' + (x.stopped ? x.attemptedMax + ' attempted' : x.max) + '</td><td>' + (x.grade ? esc(x.grade) : '&ndash;') + '</td><td><button class="link-btn" data-action="resit" data-version="' + x.version + '">Resit</button></td></tr>';
    });
    return h + '</table></div></div>';
  }

  function renderIntro(p){
    return '<div class="panel exam-intro"><h3>Before you start</h3><ul>' +
      '<li>You have 2 hours. A clock at the top shows how long you have taken.</li>' +
      '<li>The paper is worth 100 marks' + (p.id === 'paper3' ? ', in Section A (Microeconomics) and Section B (Macroeconomics)' : ', in three sections: short answers, explain-and-analyse questions and extended essays') + '. Answer every question.</li>' +
      '<li>Write on paper, or type in the box under each question. Draw diagrams on paper. Typed answers are saved as you go.</li>' +
      '<li>When you finish, the model answer and a levels guide appear for each question, and you mark your own work. You then get a mark out of 100 and a grade.</li>' +
      '<li>You can stop at any time. You then mark only the questions you attempted and get a mark and grade for that work.</li>' +
      '<li>Each paper has a number. Resit the same paper later, or start a new one with a different set of questions.</li>' +
      '</ul><button class="primary-btn" data-action="start-exam" data-version="new">Start a new paper</button></div>' + renderHistory(p);
  }

  function renderSitting(p){
    const qs = examQs(), ex = state.exam;
    let h = '<div class="exam-bar" role="status">';
    h += state.confirmStop
      ? '<span class="bar-q">Stop now and mark only what you have done?</span><span class="bar-btns"><button class="bar-btn solid" data-action="confirm-stop">Yes, stop the exam</button><button class="bar-btn" data-action="cancel-stop">Keep going</button></span>'
      : '<span>Paper ' + ex.version + '</span><span>Time <b id="examClock">' + fmtTime(Date.now() - ex.startedAt) + '</b> of 2:00:00</span><span><b id="answeredCount">' + countAnswered() + '</b> of ' + qs.length + ' typed</span><span class="bar-btns"><button class="bar-btn" data-action="stop-exam">Stop the exam</button></span>';
    h += '</div>';
    let last = '';
    qs.forEach(function(q){
      h += sectionHead(p.id, q, last); last = q.section;
      h += '<div class="exam-q"><div class="q-top"><span>Question ' + q.number + '</span><span>' + q.marks + ' marks</span></div><div class="q-text econ-q">' + q.q + '</div>' +
        '<label class="ans-label" for="ans' + q.number + '">Your answer (optional if you are writing on paper)</label><textarea id="ans' + q.number + '" data-qnum="' + q.number + '" placeholder="Type your answer here">' + esc(ex.answers[q.number] || '') + '</textarea></div>';
    });
    h += '<div class="panel finish"><h3>Finished?</h3><p class="exam-note">The model answers will appear and you will mark each question yourself. Then you get your mark out of 100 and a grade.</p><div class="btn-row"><button class="primary-btn" data-action="finish-exam">Finish and mark my paper</button><button class="ghost-btn" data-action="stop-exam">Stop the exam early</button></div></div>';
    h += state.confirmRestart
      ? '<div class="confirm-box"><span>Throw away this attempt and ' + (state.confirmRestart === 'new' ? 'start a new paper' : 'start paper ' + ex.version + ' again') + '?</span><button class="ghost-btn" data-action="confirm-restart">' + (state.confirmRestart === 'new' ? 'Start a new paper' : 'Start again') + '</button><button class="link-btn" data-action="cancel-restart">Cancel</button></div>'
      : '<div class="confirm-box"><button class="link-btn" data-action="restart-exam" data-version="same">Start this paper again</button><button class="link-btn" data-action="restart-exam" data-version="new">Switch to a new paper</button></div>';
    return h;
  }

  function renderMarking(p){
    const qs = examQs(), ex = state.exam;
    let h = '<div class="panel exam-intro"><h3>' + (ex.stopped ? 'You stopped the exam' : 'Time to mark your paper') + '</h3><p class="exam-note">Time taken: <b>' + fmtTime(ex.endedAt - ex.startedAt) + '</b>. For each question, compare your answer with the model answer, use the levels guide to find the best fit, and choose your mark.</p>' +
      '<p class="exam-note">' + (ex.stopped ? 'Choose <b>Not attempted</b> for any question you did not reach. Your grade is based only on the questions you attempted.' : 'Questions with nothing typed are set to <b>Not attempted</b>, which scores 0. Change this if you answered them on paper.') + '</p></div>';
    let last = '';
    qs.forEach(function(q){
      h += sectionHead(p.id, q, last); last = q.section;
      const typed = (ex.answers[q.number] || '').trim(), m = markOf(q.number);
      h += '<div class="exam-q' + (m === '' && state.markWarn ? ' needs-mark' : '') + '"><div class="q-top"><span>Question ' + q.number + ' &middot; ' + esc(q.topic) + '</span><span>' + q.marks + ' marks</span></div><div class="q-text econ-q">' + q.q + '</div>';
      if(typed) h += '<div class="your-answer"><small>Your typed answer</small><div class="typed">' + esc(typed) + '</div></div>';
      h += '<details class="reveal" open><summary>Model answer</summary><div class="inner solution-box econ-ans">' + formatAnswer(q.a) + '</div></details>';
      h += '<div class="scheme"><small>Marking guide</small>' + guideFor(q.marks) + '</div>';
      h += '<div class="mark-row"><label for="mark' + q.number + '">Marks you earned</label><select id="mark' + q.number + '" data-markq="' + q.number + '"><option value=""' + (m === '' ? ' selected' : '') + '>Choose&hellip;</option><option value="na"' + (m === 'na' ? ' selected' : '') + '>Not attempted</option>';
      for(let i = 0; i <= q.marks; i++) h += '<option value="' + i + '"' + (m === i ? ' selected' : '') + '>' + i + ' out of ' + q.marks + '</option>';
      h += '</select></div></div>';
    });
    h += '<div class="panel finish"><h3>Running total: <span id="markTotal">' + runningTotal() + '</span> marks</h3>';
    if(state.markWarn) h += '<div class="error-box">' + state.markWarn + ' question' + (state.markWarn > 1 ? 's still need' : ' still needs') + ' a mark. Choose a mark or Not attempted for each one.</div>';
    return h + '<button class="primary-btn" data-action="finish-marking">Show my mark and grade</button></div>';
  }

  function renderResult(p){
    const ex = state.exam, r = ex.result, qs = examQs();
    let h = '<div class="result-summary"><div>';
    h += ex.stopped
      ? '<div class="score-label">You stopped early. Mark on the questions you attempted</div><div class="score">' + r.gained + '<span> / ' + r.attemptedMax + '</span></div><div class="raw">' + (r.pct === null ? 'No questions attempted' : r.pct + '% of the marks you attempted') + ' &middot; ' + r.gained + ' out of ' + r.max + ' on the whole paper</div>'
      : '<div class="score-label">Your mark</div><div class="score">' + r.gained + '<span> / ' + r.max + '</span></div>';
    h += '<div class="raw">Paper ' + ex.version + ' &middot; time taken ' + fmtTime(r.timeTaken) + '</div></div>';
    h += r.grade ? '<div class="grade-badge"><small>' + (ex.stopped ? 'Grade for the work you did' : 'Indicative grade') + '</small><b>' + esc(r.grade) + '</b></div>' : '<div class="grade-badge"><small>No grade</small><b>&ndash;</b></div>';
    h += '</div>';
    if(r.grade){
      h += '<div class="panel"><h3>How the grade is worked out</h3><p class="exam-note">' + (ex.stopped ? 'You scored ' + r.pct + '% on the questions you attempted, which is' : 'Your ' + r.pct + '% is') + ' compared with these approximate grade bands.</p><div class="table-wrap"><table class="bounds"><tr><th>Grade</th>';
      GRADE_ORDER.forEach(function(g){ h += '<th' + (g === r.grade ? ' class="hit"' : '') + '>' + g + '</th>'; });
      h += '</tr><tr><td>Percentage needed</td>';
      GRADE_ORDER.forEach(function(g){ h += '<td' + (g === r.grade ? ' class="hit"' : '') + '>' + BANDS[g] + '%</td>'; });
      h += '</tr></table></div><p class="exam-note">These bands are a rough guide, not official Pearson grade boundaries, which change every year. ' + (ex.stopped ? 'A grade from part of a paper is only a rough guide, because the longer essays carry the most marks. ' : '') + 'Your real grade comes from your total across all three papers.</p></div>';
    }
    if(r.strong.length || r.weak.length){
      h += '<div class="panel">' + (r.strong.length ? '<h3>Strongest topics</h3><p>' + esc(r.strong.join(', ')) + '</p>' : '') + (r.weak.length ? '<h3>Revise these first</h3><p>' + esc(r.weak.join(', ')) + '</p>' : '') + '</div>';
    }
    h += '<div class="btn-row result-actions"><button class="primary-btn" data-action="start-exam" data-version="same">Resit paper ' + ex.version + '</button><button class="primary-btn" data-action="start-exam" data-version="new">Try a new paper</button><button class="ghost-btn" data-action="go-home">Back to the dashboard</button></div>';
    let last = '';
    qs.forEach(function(q){
      h += sectionHead(p.id, q, last); last = q.section;
      const m = markOf(q.number);
      h += '<div class="exam-q marked"><div class="q-top"><span>Question ' + q.number + ' &middot; ' + esc(q.topic) + '</span><span class="mark-pill' + (m === 'na' ? ' na' : '') + '">' + (m === 'na' ? 'Not attempted' : m + ' / ' + q.marks) + '</span></div><div class="q-text econ-q">' + q.q + '</div>' +
        '<details class="reveal"><summary>Show the model answer</summary><div class="inner solution-box econ-ans">' + formatAnswer(q.a) + '</div></details></div>';
    });
    return h + renderHistory(p);
  }

  // ---------------- Download a copy ----------------
  let downloads = null;
  function pageSource(){
    const pieces = Array.prototype.map.call(document.querySelectorAll('[data-hub]'), function(el){ return el.outerHTML; });
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Economics Study Hub</title>\n' +
      pieces.filter(function(s){ return /^<(link|style)/i.test(s); }).join('\n') + '\n</head>\n<body>\n' + SHELL_HTML + '\n' +
      pieces.filter(function(s){ return /^<script/i.test(s); }).join('\n') + '\n</body>\n</html>\n';
  }
  function showKeepCopy(){ const el = document.getElementById('keepCopy'); if(el) el.hidden = !downloads; }
  async function doDownload(){
    const msg = document.getElementById('kcMsg');
    try{
      await downloads.save({filename:'Economics-Study-Hub.html', data:pageSource()});
      if(msg) msg.textContent = 'Saved.';
    }catch(e){
      const c = e && e.code;
      if(msg) msg.textContent = c === 'declined' ? 'Download cancelled.' : c === 'rate_limited' ? 'A download is already waiting for you to confirm.' : 'Downloads are not available here.';
      if(c && c !== 'declined' && c !== 'rate_limited'){ downloads = null; showKeepCopy(); }
    }
  }

  // ---------------- Events ----------------
  document.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]'); if(!el) return;
    const a = el.getAttribute('data-action'), pid = el.getAttribute('data-paper');
    if(a === 'go-home') go('home');
    else if(a === 'go-paper') go('paper', pid);
    else if(a === 'open-topic') go('topic', pid, el.getAttribute('data-topic'));
    else if(a === 'open-exam') go('exam', pid || state.paperId);
    else if(a === 'toggle-done'){ toggleDone(state.paperId, state.topicId); render(); }
    else if(a === 'start-exam') startExam(el.getAttribute('data-version') || 'new');
    else if(a === 'resit') startExam(parseInt(el.getAttribute('data-version'), 10));
    else if(a === 'stop-exam'){ state.confirmStop = true; render(); toTop(); }
    else if(a === 'cancel-stop'){ state.confirmStop = false; render(); }
    else if(a === 'confirm-stop') endSitting(true);
    else if(a === 'finish-exam') endSitting(false);
    else if(a === 'restart-exam'){ state.confirmRestart = el.getAttribute('data-version') || 'same'; render(); }
    else if(a === 'cancel-restart'){ state.confirmRestart = false; render(); }
    else if(a === 'confirm-restart') startExam(state.confirmRestart);
    else if(a === 'finish-marking') finishMarking();
    else if(a === 'download' && downloads) doDownload();
  });
  document.addEventListener('change', function(e){
    const el = e.target;
    if(el.matches('select[data-role="jump-topic"]')) go('topic', el.getAttribute('data-paper'), el.value);
    else if(el.matches('select[data-markq]')){
      const v = el.value;
      state.exam.marks[el.getAttribute('data-markq')] = v === '' ? '' : v === 'na' ? 'na' : parseInt(v, 10);
      saveExam();
      el.closest('.exam-q').classList.toggle('needs-mark', v === '' && !!state.markWarn);
      const t = document.getElementById('markTotal'); if(t) t.textContent = runningTotal();
    }
  });
  document.addEventListener('input', function(e){
    const el = e.target;
    if(el.matches('textarea[data-qnum]') && state.exam){
      state.exam.answers[el.getAttribute('data-qnum')] = el.value; saveExam();
      const c = document.getElementById('answeredCount'); if(c) c.textContent = countAnswered();
    }
  });
  setInterval(function(){
    const el = document.getElementById('examClock');
    if(!el || !state.exam || state.exam.phase !== 'sitting') return;
    const used = Date.now() - state.exam.startedAt;
    el.textContent = fmtTime(used); el.classList.toggle('over', used > 2 * 3600 * 1000);
  }, 1000);

  render();
  // Offer "Download HTML file" only where the viewer supports saving files
  if(window.claude && typeof window.claude.use === 'function'){
    Promise.resolve(window.claude.use('downloads')).then(function(d){ downloads = d || null; showKeepCopy(); }).catch(function(){});
  }
})();

</script>
</body>
</html>
